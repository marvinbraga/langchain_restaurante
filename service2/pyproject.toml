[project]
name = "service2"
version = "2.0.0"
description = "Restaurant FAQ Service using LangChain"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "python-dotenv==1.1.0",
    "fastapi==0.115.12",
    "uvicorn==0.25.0",
    "redis==6.0.0",
    "langchain==0.3.25",
    "langchain-core==0.3.58",
    "langchain-openai==0.3.16",
    "langchain-postgres==0.0.13",
    "psycopg[binary]==3.1.18",
    "sqlalchemy==2.0.35",
    "pydantic-settings>=2.0"
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["service2*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
service2 = ["*"]
