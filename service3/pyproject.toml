[project]
name = "service3"
version = "3.0.0"
description = "Restaurant FAQ Service with ReAct Agent"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "python-dotenv==1.1.0",
    "fastapi==0.115.12",
    "uvicorn==0.25.0",
    "redis==6.0.0",
    "langchain-postgres==0.0.13",
    "langchain==0.3.25",
    "langchain-core==0.3.58",
    "langchain-openai==0.3.16",
    "langchain-community==0.3.23",
    "langgraph==0.4.1",
    "psycopg[binary]>=3.0",
    "pgvector==0.3.6",
    "tiktoken==0.9.0"
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["service3*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
service3 = ["*"]
